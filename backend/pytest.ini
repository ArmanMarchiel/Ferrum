[pytest]
# Tests import `cad2shell` and `server` as top-level modules (the same layout
# the `uvicorn src.server.app:app` run uses via PYTHONPATH=src). Put `src/` on
# sys.path so a bare `pytest` works from backend/ with no env juggling.
pythonpath = src
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
